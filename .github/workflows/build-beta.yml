name: Beta Build and Release

on:
  push:
    branches: [ beta ]
    tags:
      - 'v*b*'
      - 'v*-beta*'
      - 'v*.b*'
  workflow_dispatch:

jobs:
  build-beta:
    name: Package and Release Beta Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Plugin Zip
        run: |
          make build
          ls -lh libgen_downloader.zip

      - name: Upload Beta Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libgen_downloader_${{ github.ref_name }}
          path: libgen_downloader.zip

      - name: Create Beta GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }} (Beta)
          files: libgen_downloader.zip
          prerelease: true
          generate_release_notes: true
